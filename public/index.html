<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arrow Connections route planner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --border: #e0dfda;
        --accent: #0f6b4c;
        --accent-contrast: #ffffff;
        --danger: #a3341f;
        --leg-bg: #f0f4f2;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14161a;
          --panel: #1d2025;
          --text: #ececec;
          --muted: #9a9a9a;
          --border: #2c2f35;
          --accent: #3ecf8e;
          --accent-contrast: #08130e;
          --leg-bg: #1a2622;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14161a;
        --panel: #1d2025;
        --text: #ececec;
        --muted: #9a9a9a;
        --border: #2c2f35;
        --accent: #3ecf8e;
        --accent-contrast: #08130e;
        --leg-bg: #1a2622;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 24px 16px 48px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px;
      }
      p.subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field {
        position: relative;
        margin-bottom: 16px;
      }
      input[type="text"],
      input[type="datetime-local"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 0.95rem;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 10;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 4px;
        max-height: 220px;
        overflow-y: auto;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      .suggestions:empty {
        display: none;
      }
      .suggestions button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        background: none;
        color: var(--text);
        font-size: 0.9rem;
        cursor: pointer;
      }
      .suggestions button:hover,
      .suggestions button:focus {
        background: var(--leg-bg);
      }
      .suggestions button .stop-id {
        color: var(--muted);
        font-size: 0.78rem;
      }
      button.primary {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button.swap {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.8rem;
        cursor: pointer;
        margin-bottom: 16px;
      }
      #status {
        font-size: 0.82rem;
        color: var(--muted);
        min-height: 1.2em;
        margin-bottom: 8px;
      }
      #status.error {
        color: var(--danger);
      }
      .leg {
        background: var(--leg-bg);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .leg .row {
        display: flex;
        justify-content: space-between;
        font-size: 0.92rem;
      }
      .leg .stop {
        font-weight: 600;
      }
      .leg .time {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .leg .trip {
        margin-top: 6px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .transfer {
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        margin: -4px 0 10px;
      }
      .option {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .option-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .option-rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 0.75rem;
        font-weight: 700;
        flex-shrink: 0;
      }
      .option-duration {
        font-weight: 600;
        font-size: 0.92rem;
      }
      .option-transfers {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--muted);
      }
      footer {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
        margin-top: 24px;
      }
      footer code {
        background: var(--leg-bg);
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arrow Connections route planner</h1>
      <p class="subtitle">
        Runs a multi-criteria Profile Connection Scan Algorithm — Pareto-optimal
        over arrival time and transfers, like
        <a href="https://planner.js.org" target="_blank" rel="noopener"
          >planner.js</a
        >
        — entirely in your browser, over the <code>arrow</code>-format output of
        <a
          href="https://github.com/LinkedConnections/gtfs2lc"
          target="_blank"
          rel="noopener"
          >gtfs2lc</a
        >. No server-side routing — see <code>arrowconnections.md</code> for the
        format this reads.
      </p>

      <form class="panel" id="journey-form">
        <div class="field">
          <label for="origin-input">From</label>
          <input
            type="text"
            id="origin-input"
            autocomplete="off"
            placeholder="Search a stop…"
          />
          <div class="suggestions" id="origin-suggestions"></div>
        </div>

        <button
          type="button"
          class="swap"
          id="swap-button"
          title="Swap origin and destination"
        >
          ⇅ swap
        </button>

        <div class="field">
          <label for="destination-input">To</label>
          <input
            type="text"
            id="destination-input"
            autocomplete="off"
            placeholder="Search a stop…"
          />
          <div class="suggestions" id="destination-suggestions"></div>
        </div>

        <div class="field">
          <label for="departure-input">Depart after</label>
          <input type="datetime-local" id="departure-input" />
        </div>

        <button type="submit" class="primary" id="plan-button" disabled>
          Loading data…
        </button>
      </form>

      <div id="status"></div>
      <div id="results"></div>

      <footer id="footer"></footer>
    </main>

    <script type="module">
      import {
        tableFromIPC,
        RecordBatchReader,
      } from "https://cdn.jsdelivr.net/npm/apache-arrow@21.2.0/+esm";

      const state = {
        stops: null, // { id, name, lat, lon, parentIdx: Int32Array }
        trips: null, // { id: string[], routeIdx: Int32Array, headsign: string[] }
        routes: null, // { id: string[], shortName: string[], longName: string[] }
        manifest: null,
        // childrenOf: Map<stationIdx, childIdx[]>; searchable: idx[] with no
        // parent_station of their own (real stations, plus stops with no
        // hierarchy at all) — see buildStopFamily().
        stopFamily: null,
        originIdx: null,
        destinationIdx: null,
      };

      const el = (id) => document.getElementById(id);
      const statusEl = el("status");
      const planButton = el("plan-button");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      async function fetchResponse(url) {
        // Force a real network request every time: this page is meant to
        // be reloaded against locally-regenerated data (a new gtfs2lc run
        // writes the same file names), and a browser HTTP cache serving a
        // stale, previously-fetched version of e.g. linkedConnections.arrow
        // looks exactly like "no route found" with no error anywhere.
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok)
          throw new Error(`Could not fetch ${url}: HTTP ${response.status}`);
        return response;
      }

      async function loadSmallTable(url) {
        const table = await tableFromIPC(await fetchResponse(url));
        return table;
      }

      function columnToStringArray(table, name) {
        const vector = table.getChild(name);
        const values = new Array(table.numRows);
        for (let i = 0; i < table.numRows; i += 1) values[i] = vector.get(i);
        return values;
      }

      function columnToTypedArray(table, name) {
        return table.getChild(name).toArray();
      }

      // `parentIdx` was added to stops.arrow after this format's first
      // release. A stops.arrow written by an older gtfs2lc has no such
      // column — getChild() returns null rather than throwing — so treat
      // that as "no station hierarchy known" instead of crashing the page.
      function columnToTypedArrayOrDefault(table, name, fallbackValue) {
        const vector = table.getChild(name);
        if (vector) return vector.toArray();
        console.warn(
          `stops.arrow has no '${name}' column — regenerate with a newer ` +
            "gtfs2lc to group platforms under their station.",
        );
        return new Int32Array(table.numRows).fill(fallbackValue);
      }

      async function loadDictionaries(manifest) {
        const [stopsTable, tripsTable, routesTable] = await Promise.all([
          loadSmallTable(manifest.files.stops),
          loadSmallTable(manifest.files.trips),
          loadSmallTable(manifest.files.routes),
        ]);

        state.stops = {
          id: columnToStringArray(stopsTable, "stopId"),
          name: columnToStringArray(stopsTable, "name"),
          lat: columnToTypedArray(stopsTable, "lat"),
          lon: columnToTypedArray(stopsTable, "lon"),
          parentIdx: columnToTypedArrayOrDefault(stopsTable, "parentIdx", -1),
        };
        state.trips = {
          id: columnToStringArray(tripsTable, "tripId"),
          routeIdx: columnToTypedArray(tripsTable, "routeIdx"),
          headsign: columnToStringArray(tripsTable, "headsign"),
        };
        state.routes = {
          id: columnToStringArray(routesTable, "routeId"),
          shortName: columnToStringArray(routesTable, "shortName"),
          longName: columnToStringArray(routesTable, "longName"),
        };
        state.stopFamily = buildStopFamily(state.stops);
      }

      /**
       * Groups child stops (platforms, boarding areas, ...) under their GTFS
       * `parent_station`, and lists which stops are worth offering in a
       * search box: a real station, or a standalone stop with no hierarchy
       * at all — never a child stop directly, since no connection ever
       * departs from or arrives at a station-level row (see
       * arrowconnections.md).
       */
      function buildStopFamily(stops) {
        const childrenOf = new Map();
        const searchable = [];
        for (let i = 0; i < stops.id.length; i += 1) {
          const parent = stops.parentIdx[i];
          if (parent === -1) {
            searchable.push(i);
            continue;
          }
          if (!childrenOf.has(parent)) childrenOf.set(parent, []);
          childrenOf.get(parent).push(i);
        }
        return { childrenOf, searchable };
      }

      /**
       * Expands a selected stop (usually a station) to itself plus every
       * descendant stop, so a journey can depart from or arrive at any of
       * a station's platforms, not just the station row itself.
       */
      function expandStopFamily(idx) {
        const expanded = new Set([idx]);
        const queue = [idx];
        while (queue.length > 0) {
          const current = queue.pop();
          const children = state.stopFamily.childrenOf.get(current);
          if (!children) continue;
          for (const child of children) {
            if (!expanded.has(child)) {
              expanded.add(child);
              queue.push(child);
            }
          }
        }
        return expanded;
      }

      function setupAutocomplete(inputId, suggestionsId, onPick) {
        const input = el(inputId);
        const box = el(suggestionsId);
        let selectedIdx = null;

        function render(matches) {
          box.innerHTML = "";
          for (const idx of matches) {
            const button = document.createElement("button");
            button.type = "button";
            const name = state.stops.name[idx] || state.stops.id[idx];
            button.innerHTML = `${escapeHtml(name)} <span class="stop-id">${escapeHtml(state.stops.id[idx])}</span>`;
            button.addEventListener("click", () => {
              input.value = name;
              selectedIdx = idx;
              box.innerHTML = "";
              onPick(idx);
            });
            box.appendChild(button);
          }
        }

        input.addEventListener("input", () => {
          selectedIdx = null;
          onPick(null);
          const query = input.value.trim().toLowerCase();
          if (query.length < 1) {
            box.innerHTML = "";
            return;
          }
          const matches = [];
          for (const i of state.stopFamily.searchable) {
            if (matches.length >= 8) break;
            const name = (state.stops.name[i] || "").toLowerCase();
            const id = state.stops.id[i].toLowerCase();
            if (name.includes(query) || id.includes(query)) matches.push(i);
          }
          render(matches);
        });

        input.addEventListener("blur", () => {
          // let the click on a suggestion register before we clear the list
          setTimeout(() => (box.innerHTML = ""), 150);
        });

        return {
          get value() {
            return selectedIdx;
          },
          setByIndex(idx) {
            selectedIdx = idx;
            input.value = state.stops.name[idx] || state.stops.id[idx];
            box.innerHTML = "";
          },
        };
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function toLocalDateTimeValue(date) {
        const pad = (n) => String(n).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      async function openConnectionsReader(manifest) {
        const url = manifest.files.connections;
        const response = await fetchResponse(url);
        if (manifest.compressed) {
          const decompressed = response.body.pipeThrough(
            new DecompressionStream("gzip"),
          );
          return RecordBatchReader.from(new Response(decompressed));
        }
        return RecordBatchReader.from(response);
      }

      const MAX_SCAN_HORIZON_SECONDS = 3 * 24 * 3600; // give up after 3 days of schedule
      const MAX_DISPLAYED_OPTIONS = 6;

      // Two profile entries/options are compared on (arrival, transfers)
      // alone: whichever criterion set is passed in, an entry only "wins"
      // by being at least as good on both and strictly better on one.
      function dominates(a, b) {
        return a.arrival <= b.arrival && a.transfers <= b.transfers;
      }

      // Per-stop profile entries additionally carry a `depTime` — the
      // departure time of the connection that produced them. A later
      // depTime is *easier* to use (you have longer to get to the stop),
      // so an entry can only replace another if it is reachable in every
      // situation the other was AND at least as good: same (arrival,
      // transfers) test, but only once depTime is at least as large too.
      // Skipping the depTime check here would let an earlier, better
      // train silently delete a later, otherwise-non-dominated one that
      // is still the only option for someone who can't make the earlier
      // one — collapsing an entire day's worth of alternatives into one.
      function dominatesAsProfileEntry(a, b) {
        return a.depTime >= b.depTime && dominates(a, b);
      }

      function insertNonDominated(list, entry, dominatesFn) {
        for (const existing of list) if (dominatesFn(existing, entry)) return;
        for (let i = list.length - 1; i >= 0; i -= 1) {
          if (dominatesFn(entry, list[i])) list.splice(i, 1);
        }
        list.push(entry);
      }

      /**
       * Buffers every connection departing in [departureAfter, departureAfter
       * + horizon] into memory, in the ascending departureTime order they're
       * stored in. The multi-criteria profile scan below needs to process
       * this window in *reverse* (latest departure first) — see
       * computeJourneyProfile — which isn't possible while merely streaming
       * forward through RecordBatch pages, so this window (a few hundred
       * thousand connections at most for a multi-day horizon) is the part
       * that's held in memory, not the whole file.
       */
      async function bufferConnectionsWindow({
        manifest,
        departureAfter,
        scanLimit,
        onProgress,
      }) {
        const reader = await openConnectionsReader(manifest);
        const rows = [];
        outer: for await (const batch of reader) {
          const depStop = batch.getChild("departureStopIdx").toArray();
          const arrStop = batch.getChild("arrivalStopIdx").toArray();
          const depTime = batch.getChild("departureTime").toArray(); // BigInt64Array, seconds
          const arrTime = batch.getChild("arrivalTime").toArray();
          const trip = batch.getChild("tripIdx").toArray();

          for (let i = 0; i < batch.numRows; i += 1) {
            const t = Number(depTime[i]);
            if (t < departureAfter) continue;
            if (t > scanLimit) break outer;
            rows.push({
              dS: depStop[i],
              aS: arrStop[i],
              depTime: t,
              arrTime: Number(arrTime[i]),
              trip: trip[i],
            });
          }
          onProgress?.(rows.length);
        }
        return rows;
      }

      /**
       * The multi-criteria Profile Connection Scan Algorithm (see the CSA
       * paper, https://arxiv.org/abs/1703.05997, and planner.js's
       * implementation of it): instead of tracking a single earliest
       * arrival per stop, it builds a small Pareto-optimal *profile* per
       * stop over (arrival time, number of transfers) by scanning
       * connections in *decreasing* departure time. Read backward, each
       * connection either lets you keep riding the same trip past this
       * point (no extra transfer — tracked per trip in `tripBest`) or
       * hop off and use whatever the arrival stop's own profile already
       * offers (one more transfer). The result at the origin is a genuine
       * Pareto front: several journeys, each better than every other on at
       * least one of (departs later, arrives sooner, fewer transfers).
       */
      function computeJourneyProfile(rows, destinationSet) {
        const profile = new Map(); // stopIdx -> Array<profile entry>
        const tripBest = new Map(); // tripIdx -> Array<option> (no depTime: implicitly "now")

        for (let i = rows.length - 1; i >= 0; i -= 1) {
          const c = rows[i];

          const options = [];
          if (destinationSet.has(c.aS)) {
            // Alighting here already completes the journey.
            options.push({
              alightStop: c.aS,
              alightTime: c.arrTime,
              arrival: c.arrTime,
              transfers: 0,
              next: null,
            });
          } else {
            const arrivalProfile = profile.get(c.aS);
            if (arrivalProfile) {
              for (const e of arrivalProfile) {
                if (e.depTime < c.arrTime) continue;
                options.push({
                  alightStop: c.aS,
                  alightTime: c.arrTime,
                  arrival: e.arrival,
                  transfers: e.transfers + 1,
                  next: e,
                });
              }
            }
          }
          const staying = tripBest.get(c.trip);
          if (staying) for (const option of staying) options.push(option);

          const pruned = [];
          for (const option of options)
            insertNonDominated(pruned, option, dominates);
          if (pruned.length === 0) continue; // this connection leads nowhere useful

          tripBest.set(c.trip, pruned);

          if (!profile.has(c.dS)) profile.set(c.dS, []);
          const stopProfile = profile.get(c.dS);
          for (const option of pruned) {
            insertNonDominated(
              stopProfile,
              {
                depTime: c.depTime,
                boardStop: c.dS,
                boardTime: c.depTime,
                alightStop: option.alightStop,
                alightTime: option.alightTime,
                arrival: option.arrival,
                transfers: option.transfers,
                trip: c.trip,
                next: option.next,
              },
              dominatesAsProfileEntry,
            );
          }
        }
        return profile;
      }

      function collectOriginOptions(profile, originSet, departureAfter) {
        const merged = [];
        for (const stop of originSet) {
          const entries = profile.get(stop);
          if (!entries) continue;
          for (const entry of entries) {
            if (entry.depTime >= departureAfter) {
              insertNonDominated(merged, entry, dominatesAsProfileEntry);
            }
          }
        }
        merged.sort((a, b) => a.boardTime - b.boardTime);
        return merged;
      }

      // Each profile entry already represents one full leg (board a trip,
      // ride it — possibly through several intermediate stops — until the
      // point a transfer or the destination was found) chained via `next`,
      // so reconstructing the legs of a journey is just walking that chain.
      function reconstructLegs(originEntry) {
        const legs = [];
        for (let entry = originEntry; entry; entry = entry.next) {
          legs.push({
            trip: entry.trip,
            boardStop: entry.boardStop,
            boardTime: entry.boardTime,
            alightStop: entry.alightStop,
            alightTime: entry.alightTime,
          });
        }
        return legs;
      }

      /**
       * Plans up to MAX_DISPLAYED_OPTIONS journeys from originIdx to
       * destinationIdx, Pareto-optimal over (arrival time, transfers), all
       * departing at or after departureAfter.
       */
      async function planJourneys({
        originIdx,
        destinationIdx,
        departureAfter,
        manifest,
        onProgress,
      }) {
        // A selected origin/destination is usually a station: accept a
        // departure or arrival at any of its child stops, not just the
        // station row itself (see expandStopFamily / arrowconnections.md).
        const originSet = expandStopFamily(originIdx);
        const destinationSet = expandStopFamily(destinationIdx);
        const scanLimit = departureAfter + MAX_SCAN_HORIZON_SECONDS;

        if (originIdx === destinationIdx) {
          return {
            found: true,
            options: [{ legs: [] }],
            totalOptions: 1,
            scanned: 0,
          };
        }

        const rows = await bufferConnectionsWindow({
          manifest,
          departureAfter,
          scanLimit,
          onProgress,
        });
        const profile = computeJourneyProfile(rows, destinationSet);
        const originOptions = collectOriginOptions(
          profile,
          originSet,
          departureAfter,
        );

        if (originOptions.length === 0) {
          return {
            found: false,
            options: [],
            totalOptions: 0,
            scanned: rows.length,
          };
        }

        const options = originOptions
          .slice(0, MAX_DISPLAYED_OPTIONS)
          .map((entry) => ({
            legs: reconstructLegs(entry),
            arrival: entry.arrival,
            transfers: entry.transfers,
          }));

        return {
          found: true,
          options,
          totalOptions: originOptions.length,
          scanned: rows.length,
        };
      }

      function formatTime(seconds) {
        return new Date(seconds * 1000).toLocaleString(undefined, {
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          month: "short",
          day: "numeric",
        });
      }

      function formatDuration(seconds) {
        const minutes = Math.round(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        return hours > 0
          ? `${hours}h${String(remainder).padStart(2, "0")}`
          : `${remainder} min`;
      }

      function renderLeg(leg) {
        const routeIdx = state.trips.routeIdx[leg.trip];
        const routeName =
          state.routes.shortName[routeIdx] ||
          state.routes.longName[routeIdx] ||
          "";
        const headsign = state.trips.headsign[leg.trip];

        const div = document.createElement("div");
        div.className = "leg";
        div.innerHTML = `
      <div class="row">
        <span class="stop">${escapeHtml(state.stops.name[leg.boardStop] || state.stops.id[leg.boardStop])}</span>
        <span class="time">${formatTime(leg.boardTime)}</span>
      </div>
      <div class="row">
        <span class="stop">${escapeHtml(state.stops.name[leg.alightStop] || state.stops.id[leg.alightStop])}</span>
        <span class="time">${formatTime(leg.alightTime)}</span>
      </div>
      <div class="trip">${routeName ? escapeHtml(routeName) + " · " : ""}${escapeHtml(headsign || "")}</div>
    `;
        return div;
      }

      function renderOption(option, index) {
        const card = document.createElement("div");
        card.className = "option";

        if (option.legs.length === 0) {
          card.innerHTML = `<p style="color:var(--muted)">Origin and destination are the same stop.</p>`;
          return card;
        }

        const first = option.legs[0];
        const last = option.legs[option.legs.length - 1];
        const header = document.createElement("div");
        header.className = "option-header";
        header.innerHTML = `
      <span class="option-rank">${index + 1}</span>
      <span class="option-duration">${formatDuration(last.alightTime - first.boardTime)}</span>
      <span class="option-transfers">${option.transfers === 0 ? "direct" : `${option.transfers} transfer${option.transfers > 1 ? "s" : ""}`}</span>
    `;
        card.appendChild(header);

        for (const [legIndex, leg] of option.legs.entries()) {
          if (legIndex > 0) {
            const wait = leg.boardTime - option.legs[legIndex - 1].alightTime;
            const div = document.createElement("div");
            div.className = "transfer";
            div.textContent = `change at ${state.stops.name[leg.boardStop] || state.stops.id[leg.boardStop]} — ${formatDuration(wait)}`;
            card.appendChild(div);
          }
          card.appendChild(renderLeg(leg));
        }
        return card;
      }

      function renderResults(result) {
        const results = el("results");
        results.innerHTML = "";

        if (!result.found) {
          results.innerHTML = `<p style="color:var(--muted)">No connection found within the scanned horizon.</p>`;
          return;
        }

        for (const [index, option] of result.options.entries()) {
          results.appendChild(renderOption(option, index));
        }
      }

      async function init() {
        try {
          setStatus("Loading manifest…");
          state.manifest = await (await fetchResponse("manifest.json")).json();

          setStatus("Loading stop, route, and trip dictionaries…");
          await loadDictionaries(state.manifest);

          el("footer").textContent =
            `${state.manifest.counts.stops.toLocaleString()} stops · ` +
            `${state.manifest.counts.routes.toLocaleString()} routes · ` +
            `${state.manifest.counts.trips.toLocaleString()} trips · ` +
            `generated ${new Date(state.manifest.generatedAt).toLocaleString()}`;

          const origin = setupAutocomplete(
            "origin-input",
            "origin-suggestions",
            (idx) => {
              state.originIdx = idx;
            },
          );
          const destination = setupAutocomplete(
            "destination-input",
            "destination-suggestions",
            (idx) => {
              state.destinationIdx = idx;
            },
          );

          el("swap-button").addEventListener("click", () => {
            const originIdx = state.originIdx;
            const destinationIdx = state.destinationIdx;
            if (originIdx !== null) destination.setByIndex(originIdx);
            else el("destination-input").value = "";
            if (destinationIdx !== null) origin.setByIndex(destinationIdx);
            else el("origin-input").value = "";
            state.originIdx = destinationIdx;
            state.destinationIdx = originIdx;
          });

          el("departure-input").value = toLocalDateTimeValue(new Date());

          setStatus(
            `Ready — ${state.manifest.counts.stops.toLocaleString()} stops loaded.`,
          );
          planButton.disabled = false;
          planButton.textContent = "Plan journey";
        } catch (error) {
          console.error(error);
          setStatus(
            `Could not load data: ${error.message}. Place manifest.json, stops.arrow, ` +
              `routes.arrow, trips.arrow, and linkedConnections.arrow next to this page.`,
            true,
          );
        }
      }

      el("journey-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (state.originIdx === null || state.destinationIdx === null) {
          setStatus(
            "Pick both an origin and a destination from the suggestions.",
            true,
          );
          return;
        }
        const departureDate = new Date(el("departure-input").value);
        if (Number.isNaN(departureDate.getTime())) {
          setStatus("Pick a valid departure date/time.", true);
          return;
        }

        planButton.disabled = true;
        const startedAt = performance.now();
        el("results").innerHTML = "";
        try {
          const result = await planJourneys({
            originIdx: state.originIdx,
            destinationIdx: state.destinationIdx,
            departureAfter: Math.floor(departureDate.getTime() / 1000),
            manifest: state.manifest,
            onProgress: (buffered) =>
              setStatus(
                `Buffering the schedule… ${buffered.toLocaleString()} connections read so far.`,
              ),
          });
          const elapsed = Math.round(performance.now() - startedAt);
          const shown = result.options.length;
          const hiddenNote =
            result.totalOptions > shown
              ? ` (showing the first ${shown} of ${result.totalOptions} Pareto-optimal alternatives)`
              : "";
          setStatus(
            result.found
              ? `Found ${shown} journey option${shown === 1 ? "" : "s"}${hiddenNote} after scanning ${result.scanned.toLocaleString()} connections in ${elapsed} ms.`
              : `No journey found after scanning ${result.scanned.toLocaleString()} connections in ${elapsed} ms.`,
            !result.found,
          );
          renderResults(result);
        } catch (error) {
          console.error(error);
          setStatus(`Route planning failed: ${error.message}`, true);
        } finally {
          planButton.disabled = false;
        }
      });

      init();
    </script>
  </body>
</html>
